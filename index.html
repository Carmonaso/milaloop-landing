<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Milaloop — Coming Soon</title>
<meta name="description" content="Milaloop is under construction. We're building something great — check back soon." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚧</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <div class="lang-switch" role="group" aria-label="Language switcher">
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="es">ES</button>
  </div>

  <main class="wrap">
    <div class="badge">
      <span class="badge-dot"></span>
      <span data-i18n="badge">Under Construction</span>
    </div>

    <div class="icon-row">
      <div class="icon icon-1">🚧</div>
      <div class="icon icon-2">⚙️</div>
      <div class="icon icon-3">🛠️</div>
    </div>

    <div class="dog-chase" aria-hidden="true">
      <img src="assets/dog-chase.gif" alt="" width="180" height="180" />
    </div>

    <h1>Milaloop</h1>
    <p class="tagline" data-i18n="tagline">Something new is being built.</p>
    <p class="subtext" data-i18n="subtext">We're working hard behind the scenes to bring Milaloop to life. Stay tuned — we'll be here soon.</p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <footer>
      <p>&copy; <span id="year"></span> Milaloop. <span data-i18n="rights">All rights reserved.</span></p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
